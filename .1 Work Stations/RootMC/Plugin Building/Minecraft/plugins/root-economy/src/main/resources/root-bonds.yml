# Root-Bonds — plugins/RootMC/root-bonds.yml
# MySQL: inherits from root-economy.yml / database.yml when host is blank.

mysql:
  enabled: true
  host: ""
  port: 3306
  database: ""
  username: ""
  password: ""
  table-prefix: "root_"
  jdbc-params: "verifyServerCertificate=false&useSSL=false&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=utf-8&serverTimezone=UTC"
  # Global playtime table (prefix + playtime), scope=*
  playtime-table: "playtime"

bonds:
  enabled: true
  min-principal-g: 1.0
  # Share of eligible reserve inflows paid to bond holders (pro-rata by outstanding principal).
  # Eligible: tax, death fees, mint trails, loan INTEREST repayments, etc.
  # NOT /pay reserve (DONATION), and NOT loan PRINCIPAL repayments (returning lent capital is closed-loop).
  # Loan interest: income-share (default 25%) of LOAN_INTEREST credits feeds the coupon pool; remainder stays in Reserve.
  # Payouts pause automatically while the post-reset reserve ledger is below 0 G.
  income-share: 0.25
  # Legacy preview rows under the action bar (0 = compact single-row vault).
  # Coupon claim chest is unused — earnings compound into note principal.
  gold-chest-rows: 0
  # One Minecraft day = 24000 world ticks (~30 min with minecraft-day.enabled). Coupon pool settles at each rollover.
  mc-day-ticks: 24000
  day-world: ""
  # After downtime, only the last N MC days get real coupon payouts (~96 ≈ 2 real days). Older gaps are skip-marked.
  catch-up-max-mc-days: 96
  # Town/nation bank balances are auto-bonded (no paper note). Earnings deposit to the bank each MC day.
  auto-bond-governments: true
  sync-on-mc-day: true
  sync-interval-minutes: 5
  # Active holders: earnings compound into bonded-note principal each MC day (redeem note in full for wallet Notes).
  auto-pay-earnings-wallet: true
  # After this many hours without login, bond notes are auto-redeemed and inactivity tax applies (28 days).
  claim-expiry-hours: 672

bonded-root:
  cost-g: 1000.0
  # Gen1 issues Bonded Roots, but they do not earn until imported on Gen2.
  register-for-earnings: false

# Inactive players/towns/nations earn no bond coupons (grace synced from root-upkeep.yml when present).
activity:
  grace-days: 7

