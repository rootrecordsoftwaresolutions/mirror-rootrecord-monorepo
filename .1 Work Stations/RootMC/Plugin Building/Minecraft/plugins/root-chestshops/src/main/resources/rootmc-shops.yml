# RootMC Shops — chest-based player shops + optional virtual storage

# File: plugins/RootMC/rootmc-shops.yml

virtual:
  enabled: true

economy:
  # Cap unit price at avg × (1 + percent/100). 0 or negative = uncapped.
  max-price-percent-over-avg: 10

fees:
  shop-stock: 5.0

towny:
  require-shop-plot: false
  shop-plot-type-names:
    - shop

