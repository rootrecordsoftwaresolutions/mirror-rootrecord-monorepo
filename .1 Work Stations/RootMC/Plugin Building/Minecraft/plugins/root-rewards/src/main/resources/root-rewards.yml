# Root-Rewards — plugins/RootMC/root-rewards.yml
# MySQL: plugins/RootMC/database.yml

playtime:
  check-interval-seconds: 60
  top-limit: 10
  # RootMC playtime table (prefix + rootmc_playtime)
  use-rootmc-playtime: true
  rootmc-playtime-table: rootmc_playtime

vote:
  gold-min: 1
  gold-max: 20
  broadcast-every: 5
  broadcast-enabled: true
  # Every confirmed vote → Discord #ingame-chat (earned + all-time totals).
  discord-relay: true
  reminder-enabled: true
  reminder-interval-seconds: 3600
  reminder-after-hours: 24
  # Cooldown display for /vote timers (listing sites still enforce their own gates + Votifier).
  # reset: rolling = hours since last confirmed vote; daily = next calendar reset at `at` in `timezone`.
  links:
    # Official: once per calendar day (not rolling 24h). Common ops use midnight Eastern.
    - name: "Minecraft-MP"
      url: "https://minecraft-mp.com/server/359724/vote/"
      reset: daily
      at: "00:00"
      timezone: "America/New_York"
    # Official help: once per day; new day at midnight UTC.
    - name: "MinecraftServers.org"
      url: "https://minecraftservers.org/vote/689134"
      reset: daily
      at: "00:00"
      timezone: "UTC"
    # Staff FAQ: fixed daily reset at midnight UTC (GMT+0).
    - name: "Minecraft Server List"
      url: "https://minecraft-server-list.com/server/521165/vote/"
      reset: daily
      at: "00:00"
      timezone: "UTC"
    # Calendar day in UTC (matches Buzz site gate — not Eastern).
    - name: "Minecraft.Buzz"
      url: "https://minecraft.buzz/vote/21857"
      reset: daily
      at: "00:00"
      timezone: "UTC"
    # No clear official fixed clock; treat as rolling 24h from last vote.
    - name: "TopMinecraftServers"
      url: "https://topminecraftservers.org/vote/43816"
      reset: rolling
      hours: 24
    # No clear official fixed clock; treat as rolling 24h from last vote.
    - name: "MineRank"
      url: "https://www.minerank.com/rootmc-top-tier-economy-server/vote"
      reset: rolling
      hours: 24
    # Official blog: once every 24 hours (rolling).
    - name: "MinecraftList.org"
      url: "https://minecraftlist.org/vote/34144"
      reset: rolling
      hours: 24
    # Official vote FAQ: once each day; timer resets at 12:00 AM EST (was rolling 24h).
    - name: "Planet Minecraft"
      url: "https://www.planetminecraft.com/server/rootmc/vote/"
      reset: daily
      at: "00:00"
      timezone: "America/New_York"

