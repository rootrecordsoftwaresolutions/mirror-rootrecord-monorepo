name: Root-Webstat
version: '${version}'
main: com.rootrecord.minecraft.rootwebstat.RootWebstatPlugin
api-version: '26.1'
description: Per-server stats website + JSON APIs — totals, average, median, mean, highest, lowest
author: Root Record
website: https://rootmc.net/plugins/
depend: [Root-Core]
softdepend: [Root-Essentials, Root-Times, Vault, RootMC]
commands:
  webstat:
    description: Root-Webstat status and reload
    usage: /<command> [reload|status|push]
    permission: rootwebstat.admin
permissions:
  rootwebstat.admin:
    description: Manage Root-Webstat
    default: op
