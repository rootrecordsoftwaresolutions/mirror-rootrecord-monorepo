    match: [/reserve]
  - id: eco.totals
    title: View economy list totals
    hint: Run /totals
    host: both
    match: [/totals, /economylist]
  - id: eco.economy
    title: View economy overview
    hint: Run /economy
    host: both
    match: [/economy]
  - id: eco.tax
    title: View live tax rate
    hint: Run /tax
    host: both
    match: [/tax]
  - id: gamble.hub
    title: Open the gamble menu
    hint: Run /gamble
    host: both
    match: [/gamble, /casino, /bets]
  - id: gamble.roulette
    title: Try roulette (or open usage)
    hint: Run /roulette
    host: both
    match: [/roulette]
  - id: gamble.hilo
    title: Try HiLo (or open usage)
    hint: Run /hilo
    host: both
    match: [/hilo]
  - id: gamble.lotto
    title: Buy a lotto ticket (or check pot)
    hint: Run /lotto
    host: both
    match: [/lotto]
  - id: gamble.coin
    title: Coin flip a player (or open usage)
    hint: Run /coin
    host: both
    match: [/coin]
  - id: gamble.dice
    title: Dice duel a player (or open usage)
    hint: Run /dice
    host: both
    match: [/dice]
  - id: eco.mint
    title: Use the mint
    hint: Run /mint (hand, all, or gold)
    host: both
    match: [/mint]

