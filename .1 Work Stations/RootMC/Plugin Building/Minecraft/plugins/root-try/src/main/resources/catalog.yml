# Root-Try catalog — source of truth for in-game tries + Discord #tasks mirror.
# host: both | towny | claims
# match: command path prefixes (lowercase), any match completes the try
# reward-g omitted → use root-try.yml reward-g (1)

version: 5

tries:
  # ——— Economy ———
  - id: eco.balance
    title: Check your balance
    hint: Run /balance or /bal
    host: both
    match: [/balance, /bal]
  - id: eco.pay
    title: Pay someone (or try /pay)
    hint: Run /pay with a player and amount (or open usage)
    host: both
    match: [/pay]
  - id: eco.paytoggle
    title: Toggle incoming payments
    hint: Run /paytoggle
    host: both
    match: [/paytoggle]
  - id: eco.baltop
    title: View balance leaderboard
    hint: Run /baltop
    host: both
    match: [/baltop, /balancetop]
