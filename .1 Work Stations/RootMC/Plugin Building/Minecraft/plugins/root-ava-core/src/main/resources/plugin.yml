name: Root-Ava-Core
version: '${version}'
main: com.rootrecord.minecraft.rootavacore.RootAvaCorePlugin
api-version: '26.1'
description: Ava companion — status + Ava's Army departments
author: Root Record
website: https://rootmc.net/plugins/
depend: [Root-Core]
commands:
  ava:
    description: Ava companion status and Ava's Army
    usage: /<command> [army|tip|pulse|help|reload]
permissions:
  rootavacore.use:
    description: Use /ava and /ava army
    default: true
  rootavacore.admin:
    description: Reload Root-Ava-Core
    default: op
