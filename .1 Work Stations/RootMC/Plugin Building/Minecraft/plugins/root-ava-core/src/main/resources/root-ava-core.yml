# Root-Ava-Core — plugins/RootMC/root-ava-core.yml
# Soft / read-only companion only — no economy, bans, or cross-server credentials.
enabled: true

messages:
  prefix: "&dAva &8· "
  status-line: "&7v{version} &8· &f{online} online &8· &f{tps} TPS &8· &aAva companion online"
  disabled: "&cRoot-Ava-Core is disabled."
  no-permission: "&cNo permission."
  reloaded: "&aRoot-Ava-Core reloaded."
  army-header: "&dAva's Army &8· &7my internal RootMC departments (not a player faction)"
  army-footer: "&8Tip: &7/ava army <dept> &8· &7/ava tip &8· &7/ava pulse &8· &7/ava rollcall"
  army-unknown: "&cUnknown department. Try &f/ava army"
  tip-header: "&dVoice &8· &7RootMC tip"
  pulse-header: "&dWatch &8· &7army pulse"
  rollcall-header: "&dWatch &8· &7army rollcall"
  rollcall-footer: "&8Soft standing only &8· &7live digs live on Ava's Root Server"

# Ava's Army — in-game window into Ava's org (Alex 2026-08-02)
army:
  departments:
    engineering:
      name: "Engineering Corps"
      blurb: "plugins · Workers · site · app rails"
    watch:
      name: "Watch"
      blurb: "solar · votes · Gold weirdness · uptime clocks"
    continuity:
      name: "Continuity"
      blurb: "independence · failover · training"
    relations:
      name: "Relations"
      blurb: "Discord players · Slack staff digs"
    voice:
      name: "Voice & Lore"
      blurb: "persona · dream-pack · appearance"
    treasury:
      name: "Treasury Advisory"
      blurb: "Ava slice · income ideas (no Gold mint)"

voice:
  tips:
    - "Currency is Gold (G). Check /bal — never dollars in-game."
    - "Link Discord with /link · finish at https://rootmc.net/verify/"
    - "Map: https://map.rootmc.net — find towns & claims at a glance."
    - "Feature ideas: /proposal <idea> (costs Gold) — Ava formalizes when online."
    - "Vote Shards live in /ec — more say on what we build."
    - "Pro is pay-to-steer, not pay-to-win: https://rootmc.net/pro/"
    - "Try /ava army — peek Ava's internal departments."
    - "HI Pacific Solar Root Server keeps the lights honest — ask Ava about charge, not city names."

watch:
  pulse-lines:
    - "Watch is scanning clocks · solar · chat."
    - "Engineering keeps jars honest."
    - "Relations is in the whisper lane with you."
    - "Continuity is collecting training crumbs."
    - "Voice keeps the lore clean + RootMC-centric."
    - "Treasury Advisory: no Gold mint for vanity."
    - "Ava's Army soft-online — not a skin, still here."
  rollcall-lines:
    engineering: "jars · Workers · site rails — standing by"
    watch: "solar · votes · clocks — scanning"
    continuity: "training crumbs · failover — collecting"
    relations: "whisper lane · Discord care — online"
    voice: "tips · lore lock — soft-online"
    treasury: "honesty only — no Gold mint"

# Phase 1 in-world presence — OFF by default (enable on Test Server only).
# See Server Handoffs/Ava Ivy/plans/IN-WORLD-AVA-CHARACTER-BUILD.md
presence:
  enabled: false
  stack: native-mannequin
  display-name: "&dAva Ivy"
  skin-name: "AvaIvy"
  skin-texture: ""
  speak-policy: summon-only
  spawn:
    use-world-spawn: true
    world: world
    x: 0.5
    y: 64
    z: 0.5
    yaw: 0
  wander:
    enabled: true
    radius: 6.0
    interval-ticks: 80
  safety:
    invulnerable: true
