<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Root-Times</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Root-Times</h1>
    <p class="lead">Local Minecraft-day and activity status. Edit these files under <code>plugins/RootMC/times/web/</code>.</p>
    <section id="day-card">
      <h2>Minecraft day</h2>
      <p id="day-line">Loading…</p>
    </section>
    <section>
      <h2>Online</h2>
      <p id="online-line">—</p>
      <ul id="player-list"></ul>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
