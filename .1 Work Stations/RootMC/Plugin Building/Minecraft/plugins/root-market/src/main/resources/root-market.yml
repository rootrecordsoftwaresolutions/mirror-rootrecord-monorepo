# Root-Market — plugins/RootMC/root-market.yml

# Category browse + BUY/SELL lore from live player chest shops (not a server NPC shop)
browse:
  categories: true
  # Include items that only have BUY shops (you can /sell to them) in category lists
  show-buy-only-items: true
  # Merge chestless virtual listings into /market quotes and item pages
  include-virtual: true

# Trending Items panel (spyglass) — MC-Complex style
# Sell multi = best active buy-shop payout vs baseline (what /sell pays)
# Buy multi  = cheapest in-stock sell listing vs baseline (hub prices)
trending:
  enabled: true
  top-n: 5
  min-shops: 1
  # sell | buy | both
  mode: sell
  # worth = Root-Economy worth.yml (fallback: opposite-side median, then peer median)
  # median-peer = median of same-side listing prices for that item
  baseline: worth
  skip-without-baseline: false

