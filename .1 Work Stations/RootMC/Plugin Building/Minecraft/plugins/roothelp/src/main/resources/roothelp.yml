discord:
  invite-url: "https://discord.gg/rFFQYrNaqS"
  guild-name: "RootMC Discord"
  verify-url: "https://rootmc.net/verify"
  wiki-commands-url: "https://rootmc.net/wiki/player/#commands"

# Optional override; leave blank to use server.map-url from plugins/RootMC/rootmc.yml
map:
  base-url: ""

commands:
  lines-per-page: 10

command-test:
  enabled: false
  total-gold-cap: 1000.0
  reminder-interval-seconds: 120
  action-bar-reminders: true
  fee-refund: true
  mysql:
    enabled: true
    host: ""
    port: 3306
    database: ""
    username: ""
    password: ""
    table-prefix: "root_"
    jdbc-params: "verifyServerCertificate=false&useSSL=false&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=utf-8&serverTimezone=UTC"
  messages:
    intro-detail: "&7Run each command you have access to &fonce&7 - reminders stop when you use it. Up to &f1000 G&7 total (&f{per} G&7 Ã- &f{count}&7 commands). Paid commands get &fone free test use&7."
