rules:
  - "&cNo cheating. &7No x-ray, dupes, macros, hacked clients, automation, or exploit abuse. Report bugs instead of using them."
  - "&cNo harassment. &7No slurs, threats, sexual content toward players, targeted toxicity, or trying to drive people off the server."
  - "&eRespect land. &7Do not grief claimed towns, bypass protections, lava/water grief, or abuse wilderness edges to damage builds."
  - "&eTowny matters. &7Join or found towns for protected land. Towns/nations handle their own rules as long as they follow server rules."
  - "&6Gold economy. &7Gold (G) is player-earned through mining, trade, shops, loans, bonds, and taxes. Do not fake markets or manipulate bugs."
  - "&6Fair shops. &7Shop prices must stay within the configured market cap. Predatory pricing or bypass tricks can be removed."
  - "&bPvP and conflict. &7PvP is limited by server settings and consent systems. Do not use traps or mechanics to bypass intended protections."
  - "&bStaff tools. &7Do not ask for command cheats like /heal, /feed, /repair, or item spawning. Staff-only means staff-only."
  - "&aGet help. &7Use chat or Discord for questions. Link with &f/link &7for stats, app features, and Discord verification."

command-list:
  - section: "Start here - first 10 minutes"
    items:
      - cmd: "/rules"
        desc: "Read the short rules and open the full constitution"
      - cmd: "/rtp"
        desc: "Leave spawn and find wilderness to explore (starter grace only)"
      - cmd: "/map"
        desc: "Open the live map near your location"
        permission: rootstat.map
      - cmd: "/sethome"
        desc: "Save your current spot as home"
      - cmd: "/home"
        desc: "Teleport back to your saved home"
      - cmd: "/balance (/bal)"
        desc: "Check your Gold balance"
      - cmd: "/shop create [price]"
        desc: "Create a chest shop from the item in your hand"
        test-key: shop-create
      - cmd: "/town new <name>"
        desc: "Found a protected Towny town when you are ready (400 G)"
        test-key: town-new
        test-fee: 400
      - cmd: "/town claim"
        desc: "Claim the chunk you are standing in for your town"
      - cmd: "/link"
        desc: "Link your account for stats, app, and Discord features"
        permission: rootstat.link
  - section: "Land and towns"
    items:
      - cmd: "/towny map"
        desc: "View nearby town chunks in chat"
      - cmd: "/town deposit <amount>"
        desc: "Add Gold to your town bank"
      - cmd: "/town invite <player>"
        desc: "Invite a player to your town"
      - cmd: "/plot claim"
        desc: "Claim a personal plot inside a town"
      - cmd: "/territories"
        desc: "Check the zone, allegiance, and wilderness-alert status where you stand"
      - cmd: "/territories notifications [on|off|status]"
        desc: "Toggle territory border messages"
  - section: "Gold and economy"
    items:
      - cmd: "/pay <player> <amount>"
        desc: "Send Gold to another player"
      - cmd: "/paytoggle"
        desc: "Toggle whether players can pay you"
      - cmd: "/mint hand | /mint all | /mint gold <amount|max>"
        desc: "Convert physical gold and wallet Gold at the mint peg"
      - cmd: "/value [item]"
        desc: "Check carried item value or look up one item"
      - cmd: "/sell hand | /sell all | /sell blocks"
        desc: "Sell items using shop-market average or fallback worth"
      - cmd: "/economy"
        desc: "View Notes, mined gold backing, and over-issue status"
      - cmd: "/reserve"
        desc: "View Server Reserve, backing, and dividends"
      - cmd: "/tax"
        desc: "View the live transaction tax rate"
      - cmd: "/gamble"
        desc: "Open the gamble menu (roulette, hilo, lotto, coin, dice — first play free each)"
      - cmd: "/roulette <amount> <red|black|green|0-36>"
        desc: "European roulette vs Server Reserve"
      - cmd: "/hilo <amount> <high|low>"
        desc: "High/low vs Server Reserve"
      - cmd: "/lotto [1-500]"
        desc: "Buy a lotto ticket or view jackpot (draws each Minecraft day)"
      - cmd: "/coin <player> <amount>"
        desc: "Challenge a player to a coin flip"
      - cmd: "/dice <player> <amount>"
        desc: "Challenge a player to a dice duel"
      - cmd: "/baltop players | towns | nations"
        desc: "View balance leaderboards"
  - section: "Shops"
    items:
      - cmd: "/buy <item> [amount]"
        desc: "Buy from the cheapest in-stock player shop"
      - cmd: "/sell <item> [amount]"
        desc: "Sell to the best-paying buy shop"
      - cmd: "/shop stock confirm"
        desc: "Pay merchant fee to stock a sell shop from inventory"
        test-key: shop-stock
        test-fee: 5
      - cmd: "/shop edittype"
        desc: "Toggle a shop between sell and buy mode"
      - cmd: "/shop editprice"
        desc: "Change shop price"
      - cmd: "/shop editqty"
        desc: "Change shop quantity per sale"
      - cmd: "/shop remove"
        desc: "Remove a shop from the target chest"
      - cmd: "/shop avg <item>"
        desc: "Show market average and price cap"
  - section: "Travel and homes"
    items:
      - cmd: "/spawn"
        desc: "Return to server spawn"
      - cmd: "/tpa | /tpahere | /tpaccept | /tpdeny"
        desc: "Consent-based player teleport requests"
      - cmd: "/homes"
        desc: "List your homes"
      - cmd: "/delhome <name>"
        desc: "Delete a home"
      - cmd: "/renamehome <old> <new>"
        desc: "Rename a home"
      - cmd: "/warp | /warps"
        desc: "Use or list public warps"
      - cmd: "/top"
        desc: "Teleport to the surface (10 G)"
  - section: "Help and community"
    items:
      - cmd: "/cmds [page]"
        desc: "This command list"
      - cmd: "/discord"
        desc: "Discord invite and profile link status"
      - cmd: "/feedback <message>"
        desc: "Send bugs or suggestions to staff"
      - cmd: "/playtime"
        desc: "View your playtime and milestones"
        permission: rootrewards.use
      - cmd: "/vote"
        desc: "Vote links and vote rewards"
        permission: rootrewards.vote
      - cmd: "/msg <player> <text> | /reply (/r)"
        desc: "Private messages"
      - cmd: "/ignore <player> | /unignore <player>"
        desc: "Mute or unmute a player"
      - cmd: "/mail | /mail send | /mail read | /mail clear"
        desc: "Offline mail"
  - section: "Advanced systems"
    items:
      - cmd: "/loan take <amount>"
        desc: "Borrow Gold based on credit limit"
        permission: rootloans.use
      - cmd: "/loan info"
        desc: "View loan balance, limit, and interest"
        permission: rootloans.use
      - cmd: "/loan repay <amount|all>"
        desc: "Repay a loan"
        permission: rootloans.use
      - cmd: "/rank list | /rank info | /rank buy"
        desc: "View and buy progression ranks"
        permission: rootranks.use
      - cmd: "/skills [skill]"
        desc: "View Root-Skills progression (replaces /mcstats)"
      - cmd: "/mcstats (/stats)"
        desc: "Legacy skills view — prefer /skills"
      - cmd: "/mctop [skill]"
        desc: "Legacy skill leaderboards — prefer /skills"
      - cmd: "/show hand"
        desc: "Show your held item in chat"
      - cmd: "/kit starter | /kit list"
        desc: "Claim or list kits"
  - section: "Staff"
    items:
      - cmd: "/grant <player> <amount> [reason]"
        desc: "Pay Gold from server treasury"
        permission: rootessentials.grant
      - cmd: "/rootstat sync"
        desc: "Force cloud sync"
        permission: rootstat.sync
      - cmd: "/rootstat reload"
        desc: "Reload RootMC config"
        permission: rootstat.reload
      - cmd: "/rootloans reload"
        desc: "Reload loan config"
        permission: rootloans.reload
      - cmd: "/rootrestart [cancel]"
        desc: "Graceful restart countdown"
        permission: rootrestart.admin
      - cmd: "/rootstop [cancel]"
        desc: "Stop for update countdown"
        permission: rootrestart.admin