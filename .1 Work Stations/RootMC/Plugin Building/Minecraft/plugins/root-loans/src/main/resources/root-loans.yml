  prefix: ""
  no-permission: "&cYou do not have permission."
  players-only: "&cPlayers only."
  disabled: "&eLoans are disabled."
  treasury-unavailable: "&cLoans need Root-Essentials treasury — update &froot-loans&c + &froot-essentials&c and restart."
