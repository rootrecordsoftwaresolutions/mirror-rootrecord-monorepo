# Root-Loans — plugins/RootMC/root-loans.yml

mysql:
  enabled: true
  host: ""
  port: 3306
  database: ""
  username: ""
  password: ""
  table-prefix: "root_"
  jdbc-params: "verifyServerCertificate=false&useSSL=false&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=utf-8&serverTimezone=UTC"

loan:
  enabled: true
  interest-rate: 0.10
  default-max-loan: 100.0
  rank-limits-enabled: true
  max-cap-mode: rank
  max-takes-per-24h: 3
  max-concurrent-loans: 3
  income-sweep-percent: 1.0
  gold-ore-repayment: true

town-loan:
  enabled: true
  max-loan: 500.0
  interest-rate: 0.10

loan-daily-tax:
  enabled: true
  # Daily % of outstanding balance added to owed. 0 = off (no accrual / no chat).
  rate: 0
  schedule-hour-hst: 0
  poll-seconds: 300
  min-accrual: 0.01

