name: Root-Torch
version: '${version}'
main: com.rootrecord.minecraft.roottorch.RootTorchPlugin
api-version: '26.1'
description: Social pass-the-torch minigame — light, pass, longest-burn record (Root-Joint alternative)
author: Root Record
website: https://rootmc.net
softdepend: [Root-Core, Root-Economy, Root-Essentials, RootMC, Root-Joint, Vault, PlaceholderAPI]
commands:
  torch:
    description: Light a torch for Gold, or view the longest burn record
    usage: /torch [longest|price|reload]
  torchpass:
    description: Pass the torch to another online player
    usage: /torchpass <player>
    aliases: [tpass]
permissions:
  roottorch.use:
    description: Light and pass the torch
    default: true
  roottorch.bypass-fee:
    description: Light a torch without paying Gold
    default: op
  roottorch.reload:
    description: Reload root-torch.yml
    default: op
  roottorch.price:
    description: View or set /torch Gold price
    default: op
