name: Root-Joint
version: '${version}'
main: com.rootrecord.minecraft.rootjoint.RootJointPlugin
api-version: '26.1'
description: Pass-the-torch / pass-the-joint minigame — torch by default; unlock-joint for 18+
author: Root Record
website: https://rootmc.net
softdepend: [Root-Core, Root-Economy, Root-Essentials, RootMC, Vault, PlaceholderAPI]
commands:
  torch:
    description: Light a torch for Gold (default mode), or view the longest burn record
    usage: /torch [longest|price|reload]
  torchpass:
    description: Pass the torch to another online player
    usage: /torchpass <player>
    aliases: [tpass]
  joint:
    description: Light a joint for Gold (requires unlock-joint: true), or view the longest burn record
    usage: /joint [longest|price|reload]
  pass:
    description: Pass the active torch/joint to another online player
    usage: /pass <player>
    aliases: [jointpass]
permissions:
  rootjoint.use:
    description: Light and pass the torch/joint
    default: true
  rootjoint.bypass-fee:
    description: Light without paying Gold
    default: op
  rootjoint.reload:
    description: Reload root-joint.yml
    default: op
  rootjoint.price:
    description: View or set Gold price
    default: op
  roottorch.use:
    description: Alias of rootjoint.use
    default: true
  roottorch.bypass-fee:
    description: Alias of rootjoint.bypass-fee
    default: op
  roottorch.reload:
    description: Alias of rootjoint.reload
    default: op
  roottorch.price:
    description: Alias of rootjoint.price
    default: op
