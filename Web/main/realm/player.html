<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Player stats — RootRecord Realm</title>
  <meta name="description" content="Public RootStat player profile by Minecraft UUID.">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="stylesheet" href="/styles.css?v=12">
  <link rel="canonical" href="https://rootrecord.info/realm/player/">
  <style>
    .stats-wrap { max-width: 42rem; margin: 0 auto; }
    .profile-row { display: flex; gap: 1.25rem; align-items: flex-start; }
    .profile-row img { width: 96px; height: 96px; border-radius: 8px; image-rendering: pixelated; }
    .badge { display: inline-block; padding: 0.2rem 0.55rem; border-radius: 999px; font-size: 0.85rem; margin-top: 0.35rem; }
    .badge-ok { background: rgba(46, 125, 50, 0.15); color: #2e7d32; }
    .badge-warn { background: rgba(198, 123, 0, 0.15); color: #a66a00; }
    .uuid { font-family: var(--font-mono, monospace); font-size: 0.85rem; word-break: break-all; color: var(--ink-muted); }
    #world-list { margin: 0.5rem 0 0; padding-left: 1.2rem; }
    .mcmmo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(7.5rem, 1fr)); gap: 0.45rem; margin-top: 0.65rem; }
    .mcmmo-skill { border: 1px solid var(--line); border-radius: 8px; padding: 0.4rem 0.55rem; font-size: 0.82rem; }
    .mcmmo-skill strong { display: block; font-size: 1rem; }
    .mcmmo-power { font-size: 1.05rem; margin: 0.35rem 0 0; }
  </style>
</head>
<body>
  <div class="site">
    <header class="site-header">
      <div class="container site-header-inner">
        <a class="brand" href="/"><img class="brand-mark" src="/favicon-180.png" alt="" width="32" height="32">RootRecord</a>
        <nav class="site-nav">
          <a href="/realm/">Realm</a>
          <a href="/realm/verify/">Verify</a>
        </nav>
      </div>
    </header>

    <main class="site-main section">
      <div class="container stats-wrap">
        <p class="breadcrumb"><a href="/realm/">Realm</a> / Player stats</p>
        <p id="status" class="status" role="status"></p>

        <section id="panel-loading" class="card-plain">
          <p style="margin:0">Loading…</p>
        </section>

        <section id="panel-error" class="card-plain" hidden>
          <h1 style="margin-top:0">Invalid player link</h1>
          <p class="note">Use <code>/rootstat</code> in-game for your public stats URL.</p>
        </section>

        <section id="panel-stats" class="card-plain" hidden>
          <div class="profile-row">
            <img id="avatar" src="/favicon-180.png" alt="" width="96" height="96">
            <div>
              <h1 id="player-name" style="margin:0">Player</h1>
              <p id="verified-badge" class="badge badge-warn">—</p>
              <p class="uuid" id="player-uuid"></p>
              <p class="note" style="margin-top:0.5rem">Verified: <span id="verified-at">—</span></p>
            </div>
          </div>
          <p id="player-bio" class="note" hidden style="margin-top:1rem"></p>
          <hr style="margin:1.25rem 0;border:none;border-top:1px solid var(--line)">
          <h2 style="margin-top:0;font-size:1.1rem">McMMO</h2>
          <p id="mcmmo-empty" class="note">No McMMO data synced yet.</p>
          <div id="mcmmo-panel" hidden>
            <p class="mcmmo-power">Power level: <strong id="mcmmo-power">—</strong></p>
            <p class="note" style="margin:0.25rem 0 0">Last synced: <span id="mcmmo-synced">—</span></p>
            <div id="mcmmo-skills" class="mcmmo-grid"></div>
          </div>
          <hr style="margin:1.25rem 0;border:none;border-top:1px solid var(--line)">
          <h2 style="margin-top:0;font-size:1.1rem">Shared worlds</h2>
          <ul id="world-list" class="note"></ul>
        </section>
      </div>
    </main>
  </div>
  <script src="/realm-player.js?v=4" defer></script>
</body>
</html>
