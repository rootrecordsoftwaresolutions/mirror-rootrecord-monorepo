# RootMC API — dedicated Cloudflare account (rootmc.net). Not on RootRecord shards.
#
# Deploy: powershell -File deploy.ps1  (loads Desktop\RootMC\.env or repo credentials.env)
# D1:     powershell -File d1-apply-remote.ps1
#
# Secrets (deploy.ps1): JWT_SECRET, DISCORD_ROOTMC_BOT_TOKEN, DISCORD_ROOTMC_CLIENT_SECRET,
#   GROK_API_BEARER_TOKEN, DISCORD_ROOTMC_WEBHOOK_URL (optional), FCM_SERVICE_ACCOUNT_JSON (shop alerts)
#
# Discord OAuth redirect: https://api.rootmc.net/v1/discord/rootmc/oauth/callback
# Interactions: POST https://api.rootmc.net/v1/discord/rootmc/interactions
name = "rootmc-api"
main = "src/index.ts"
compatibility_date = "2024-11-01"
account_id = "f3372b30093435bacc35b69972abeb2e"

[[d1_databases]]
binding = "DB"
database_name = "rootmc"
# Created on first deploy: npx wrangler d1 create rootmc --config wrangler.toml
database_id = "6cf71128-67e3-47b2-a802-d6c23d6489e0"

[[r2_buckets]]
binding = "ASSETS"
bucket_name = "rootmc-bluemap"

[[routes]]
pattern = "api.rootmc.net"
custom_domain = true

[vars]
WORKER_SHARD = "rootmc"
SITE_URL = "https://rootmc.net"
DISCORD_ROOTMC_OAUTH_REDIRECT_URI = "https://api.rootmc.net/v1/discord/rootmc/oauth/callback"
DISCORD_ROOTMC_CLIENT_ID = "1511794429986345020"
DISCORD_ROOTMC_PUBLIC_KEY = "ca0e363025aefa97cc3906031152395cd0b915efe7283a49aa46fb96360158e3"
DISCORD_FEEDBACK_CHANNEL_ID = "1516391754625187921"
DISCORD_APP_SESSION_CHANNEL_ID = "1506162141223194754"
DISCORD_ROOTMC_AI_ARCHIVE_CHANNEL_ID = "1511922772983545947"
GROK_API_URL = "https://api.x.ai/v1/chat/completions"
GROK_MODEL = "grok-3-latest"
# Secret: GROK_API_BEARER_TOKEN (console.x.ai xai-... key) via deploy.ps1 — NOT GROK_X_* (Twitter/X only).
DISCORD_ROOTMC_GUILD_ID = "1516108585740800042"
DISCORD_ROOTMC_LINKED_ROLE_ID = "1516396491973984256"
DISCORD_ROOTMC_MINECRAFT_SYNC_ROLE_ID = "1516733173998813214"
DISCORD_ROOTMC_GENERAL_CHAT_CHANNEL_ID = "1516108586307158088"
DISCORD_ROOTMC_INGAME_CHAT_CHANNEL_ID = "1516706598519832677"
DISCORD_ROOTMC_INGAME_FEEDBACK_CHANNEL_ID = "1516828735536365669"
DISCORD_ROOTMC_REPORT_TICKETS_CATEGORY_ID = "1517360597686157605"
DISCORD_ROOTMC_TOWN_CATEGORY_ID = "1516282271848726628"
DISCORD_ROOTMC_NATION_CATEGORY_ID = "1516283613283483749"
DISCORD_ROOTMC_TOWN_INFO_CHANNEL_ID = "1516282373426249878"
DISCORD_ROOTMC_NATION_INFO_CHANNEL_ID = "1516283667364974602"
DISCORD_ROOTMC_DAILY_REPORT_CHANNEL_ID = "1516395175780286615"
DISCORD_ROOTMC_AI_RAW_ARCHIVE_CHANNEL_ID = "1507597139465867364"
DISCORD_ROOTMC_ECONOMY_ANNOUNCE_CHANNEL_ID = "1516804780884889621"
DISCORD_ROOTMC_RULES_CHANNEL_ID = "1516392367869919243"
# Operations forum — server updates + appeals (daily AI digest reads posts here).
DISCORD_ROOTMC_OPERATIONS_FORUM_CHANNEL_ID = "1516143406315737169"
DISCORD_ROOTMC_APPEALS_FORUM_CHANNEL_ID = "1516143406315737169"
DISCORD_ROOTMC_BOT_SPAM_CHANNEL_ID = "1516391754625187921"
DISCORD_ROOTMC_ACTIVE_PARTICIPANT_ROLE_ID = "1518311748627726346" # Discord role name: Top Participator
DISCORD_ROOTMC_TOP_ACTIVE_PLAYER_ROLE_ID = "1518320460729679922"

[triggers]
# Sunday 08:00 HST = 18:00 UTC — Cloudflare weekdays: 1=SUN … 7=SAT (not Unix 0=SUN).
crons = ["*/10 * * * *", "0 10 * * *", "0 18 * * 1"]
