# RootMC realm API source (shared with rootmc-api). Deploy target: rootmc-api on api.rootmc.net.
# Do NOT deploy this Worker to RootRecord — use Web/cloudflare/rootmc-api/deploy.ps1 instead.
# Retire RootRecord copies: cloudflare-delete-blocknotes-api.bat
#
# Secrets: JWT_SECRET (deploy.ps1 from ROOTRECORD_PRIMARY_JWT_SECRET / rootrecord-primary/.deploy-jwt).
#   wrangler secret put DISCORD_ROOTMC_BOT_TOKEN
#   wrangler secret put DISCORD_ROOTMC_CLIENT_SECRET   (OAuth — RootMC app, same as bot application)
#   wrangler secret put DISCORD_ROOTMC_WEBHOOK_URL   (fallback for POST /api/feedback)
# OAuth redirect (Discord Developer Portal → OAuth2): https://api.rootmc.net/v1/discord/rootmc/oauth/callback
# Interactions: POST https://api.rootmc.net/v1/discord/rootmc/interactions
#
# Production: attach a custom domain under *.rootrecord.info for SSO cookies (see web-sso.ts).
# Minecraft play host (DNS only, grey cloud): run repo-root cloudflare-setup-rootmc-play-once.bat
#   -> play.rootrecord.info A -> Shockbyte IP (ROOTMC_SERVER_IP in Web/scripts/setup-rootmc-play-dns.ps1)
# BlueMap HTTPS (Worker proxy): cloudflare-update-workers.bat minecraft-map -> map.rootrecord.info
name = "rootmc-realm-api"
main = "src/index.ts"
compatibility_date = "2024-11-01"

[[d1_databases]]
binding = "DB"
database_name = "root-record"
database_id = "0b49c598-1f91-4a09-84a8-6ba8241c6df3"

[vars]
WORKER_SHARD = "rootmc"
SITE_URL = "https://rootrecord.info"
DISCORD_ROOTMC_CLIENT_ID = "1511794429986345020"
DISCORD_ROOTMC_PUBLIC_KEY = "ca0e363025aefa97cc3906031152395cd0b915efe7283a49aa46fb96360158e3"
DISCORD_FEEDBACK_CHANNEL_ID = "1516391754625187921"
# App session starts (RootMC bot; same channel as other RootRecord apps).
DISCORD_APP_SESSION_CHANNEL_ID = "1506162141223194754"
# Dev copies of successful world AI reports (RootMC bot must have Send Messages in this channel).
DISCORD_ROOTMC_AI_ARCHIVE_CHANNEL_ID = "1511922772983545947"
GROK_API_URL = "https://api.x.ai/v1/chat/completions"
GROK_MODEL = "grok-3-latest"
# Secret: GROK_API_BEARER_TOKEN (console.x.ai xai-... key) via deploy.ps1 — NOT GROK_X_* (Twitter/X only).

# Town/nation Discord channel automation (cron every 10 min).
DISCORD_ROOTMC_GUILD_ID = "1516108585740800042"
