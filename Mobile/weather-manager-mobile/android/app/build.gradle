            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                def rawStoreFile = (keystoreProperties['storeFile'] ?: '').toString()
                def normalizedStoreFile = rawStoreFile.replace('\\', '/')
                def isAbsolutePath = normalizedStoreFile ==~ /^[A-Za-z]:\\/.*/
                storeFile isAbsolutePath ? file(normalizedStoreFile) : file("keystore/${rawStoreFile}")
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
