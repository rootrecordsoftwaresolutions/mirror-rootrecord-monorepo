// Firebase app-level Groovy: google-services plugin (version from root `plugins { ... apply false }`)
plugins {
    id 'com.google.gms.google-services'
}

apply plugin: 'com.android.application'

android {
    def keystoreProperties = new Properties()
    def keystorePropertiesFile = project.file('keystore/keystore.properties')
    if (keystorePropertiesFile.exists()) {
        keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
    }

    namespace "com.rootrecord.weathermanager"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.rootrecord.weathermanager"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Release 19 → versionCode 19; user-facing versionName 1.0.19 (aligned numbering).
        versionCode 27
        versionName "1.0.27"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                def rawStoreFile = (keystoreProperties['storeFile'] ?: '').toString()
                def normalizedStoreFile = rawStoreFile.replace('\\', '/')
                def isAbsolutePath = normalizedStoreFile ==~ /^[A-Za-z]:\\/.*/
                storeFile isAbsolutePath ? file(normalizedStoreFile) : file("keystore/${rawStoreFile}")
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach { output ->
            output.outputFileName = variant.buildType.name == "release" ? "RootRecord-Weather-release.apk" : "RootRecord-Weather.apk"
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    // Firebase BoM — keep versions aligned (see https://firebase.google.com/docs/android/setup#available-libraries)
    implementation platform('com.google.firebase:firebase-bom:34.12.0')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-messaging'
    // Google Mobile Ads SDK (AdMob)
    implementation 'com.google.android.gms:play-services-ads:25.2.0'
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'
// google-services is applied via `plugins { id 'com.google.gms.google-services' }` above — requires `app/google-services.json`.
