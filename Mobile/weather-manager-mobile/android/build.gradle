// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // AGP 8.6+ required for Kotlin 2.x metadata (see Android Kotlin support matrix).
        classpath 'com.android.tools.build:gradle:8.6.0'
        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

// Firebase Groovy equivalent of: id("com.google.gms.google-services") version "4.4.4" apply false
// Gradle requires `buildscript {}` before any `plugins {}` in this file.
plugins {
    id 'com.google.gms.google-services' version '4.4.4' apply false
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
