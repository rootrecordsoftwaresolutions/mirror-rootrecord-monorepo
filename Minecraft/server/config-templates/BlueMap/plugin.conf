## RootMC BlueMap plugin — copy to plugins/BlueMap/plugin.conf
## Fast incremental updates; never pause render for player count.
## After edits: /bluemap reload

live-player-markers: true
hidden-game-modes: [ "spectator" ]
hide-vanished: true
hide-invisible: true
hide-sneaking: false
hide-below-sky-light: 0
hide-below-block-light: 0
hide-different-world: false

write-players-interval: 2
skin-download: true

# Pause tile rendering when anyone is online (Shockbyte stability). -1 = never pause (bad on shared hosts).
player-render-limit: 1

# Safety net for missed chunk changes (minutes). 5 min hammers CPU with large maps.
full-update-interval: 1440
