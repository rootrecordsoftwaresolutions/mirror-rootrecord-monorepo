## RootMC BlueMap core — copy to plugins/BlueMap/core.conf
## Shockbyte: NEVER use render-thread-count 0 (0 = all CPU cores → server lockup / restart loop).
## Static tiles on R2 (map.rootmc.net): keep render threads at 1; run bluemap freeze after boot if needed.
## After edits: /bluemap reload

accept-download: true
data: "bluemap"

# 1 thread on shared hosting. (0 = auto = all cores — causes freeze with large tile sets.)
render-thread-count: 1
render-thread-priority: 5

scan-for-mod-resources: true
metrics: true

log: {
  # append: false
}
