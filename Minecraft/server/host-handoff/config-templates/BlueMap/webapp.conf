# BlueMap webapp — copy to plugins/BlueMap/webapp.conf on the host.
# When using R2 static hosting (see Web/cloudflare/rootrecord-minecraft-map/BLUEMAP-R2.md):
#   live-data-root points live player markers at the Worker proxy → game server :22784

# Game server + R2 static tiles: disable webapp tile UI here (map.rootmc.net serves tiles).
# Live player markers still use webserver :22784 via Worker /__bluemap-live.
enabled: false
webroot: "bluemap/web"
update-settings-file: false
use-cookies: true
default-to-flat-view: true
min-zoom-distance: 5
max-zoom-distance: 100000
resolution-default: 1
hires-slider-max: 500
hires-slider-default: 100
hires-slider-min: 0
lowres-slider-max: 7000
lowres-slider-default: 2000
lowres-slider-min: 500

# Tiles served from R2 via map.rootrecord.info; live data still from Paper (low bandwidth).
live-data-root: "https://map.rootmc.net/__bluemap-live"

scripts: []
styles: []
