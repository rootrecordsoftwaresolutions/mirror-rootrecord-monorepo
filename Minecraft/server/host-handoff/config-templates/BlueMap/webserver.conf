## RootMC BlueMap webserver — copy to plugins/BlueMap/webserver.conf
##
## R2 mode: keep enabled for live player data only. Block public :22784 in Shockbyte
## firewall so viewers use https://map.rootrecord.info (R2 + Worker proxy).
## After edits: /bluemap reload

webserver {
  enabled: true
  ip: "0.0.0.0"
  port: 22784
}
