# RootMC RootMC — live host: plugins/RootRecord/rootmc.yml
# Secrets: password below + API keys in plugins/RootRecord/cloud.yml (never commit).

cloud:
  heartbeat-interval-minutes: 5
  sync-interval-minutes: 5
  stats-url-base: "https://rootmc.net/player"

server:
  address: play.rootmc.net
  default-world-name: "RootMC"
  game-version: "26.1"
  map-url: "https://map.rootmc.net/"

mysql:
  enabled: true
  host: "mysql.shockbyte.hil2.shockbyte.host"
  port: 3306
  database: "75eedc3b19-rootmc"
  username: "75eedc3b19-rootmc-admin"
  password: ""  # Shockbyte panel password — set on host only
  table-prefix: "root_"
  pool-size: 5
  jdbc-params: "verifyServerCertificate=false&useSSL=false&useUnicode=true&characterEncoding=utf-8&serverTimezone=UTC"

mcmmo:
  enabled: true
  table-prefix: "mcmmo_"

economy:
  enabled: true
  vault-enabled: true
  shop-provider: auto
  shop-providers-priority:
    - rootmc-shops
    - quickshop
    - chestshop
    - sign
  scan-signs: true
  scan-chests: false
  max-chunks-per-sync: 16
  enforce-price-cap: false
  max-price-percent-over-avg: 10

ingame:
  enabled: true
  max-pending-events: 64

discord-chat:
  enabled: true
  poll-interval-seconds: 3
  relay-chat: true
  relay-join: true
  relay-leave: true
  relay-death: true
  inbound-format: "&8▎ &9Discord&8│ &f{user}&8 &7»&f {message}"

messages:
  prefix: "&8[&2RootMC&8]&r "
  heartbeat-ok: "&aCloud heartbeat sent."
  status: "&7RootMC &f{version}&7 — API &f{api}&7 — world &f{world}"
  link-started: "&aVerification code: &f{code}&a — open &f{url}&a (expires in 15 min)"
  link-already: "&aYour account is linked to RootRecord (&f{account}&a)."
  link-not: "&eYou are not linked. Run &f/link &7to verify."
  link-success-sync: "&aAccount linked! Syncing profile…"
  stats-link: "&7Public stats: &b{url}"
  sync-done: "&aSynced &f{count}&a player profile(s) from RootRecord cloud."
  sync-fail: "&cCloud sync failed: &f{error}"
  no-permission: "&cYou don't have permission."
  mysql-disabled: "&cMySQL is disabled in config — local cache unavailable."
  config-missing: "&cRootRecord credentials missing — edit plugins/RootRecord/cloud.yml"
  shop-price-too-high: "&cShop price &f{price}&c for &f{item}&c exceeds the server cap (&f{max}&c, avg &f{avg}&c)."
  shops-link: "&7Root Shops: &b{url}"
  waypoint-saved: "&aWaypoint saved: &f{label}&a (&7{x}&a, &7{y}&a, &7{z}&a)."
  note-saved: "&aNote saved at your location."
  ingame-not-linked: "&eLink your account first: &f/link"
  vault-claimed: "&aClaimed &f{count}&a vault item(s)."
