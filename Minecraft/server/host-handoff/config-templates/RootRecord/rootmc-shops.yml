# RootMC Shops — chest-based player shops
# File: plugins/RootRecord/rootmc-shops.yml

economy:
  max-price-percent-over-avg: 10

messages:
  prefix: "&8[&2RootMC Shops&8]&r "
  buy-hint: "&7You buy from &fplayer chest shops&7 at the &flowest in-stock price&7 — RootMC has &cno server shop&7."
