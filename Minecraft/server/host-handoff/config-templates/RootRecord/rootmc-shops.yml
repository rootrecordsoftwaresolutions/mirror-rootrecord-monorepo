  buy-stock-gone: "&eThat chest shop no longer has &f{item}&e in stock. Try `/buy {item}` again."
  buy-cancelled: "&7Purchase cancelled."
  shop-created: "&aShop created — &f{item}&a for &f{price}&a G."
  shop-removed: "&aShop removed."
  price-too-high: "&cPrice &f{price}&c exceeds cap &f{max}&c (avg &f{avg}&c)."
  buy-success: "&aPurchased &f{qty}x {item}&a for &f{total}&a G from &f{seller}&a's chest shop."
  buy-fail: "&cCould not buy &f{item}&c."
  not-looking-at-chest: "&eLook at a chest while holding the item to sell."
