# RootMC Shops — chest-based player shops

# File: plugins/RootRecord/rootmc-shops.yml



economy:
  # Price cap removed — market uses median listing price (outlier-resistant).
  max-price-percent-over-avg: 0

towny:
  require-shop-plot: true
  shop-plot-type-names:
    - shop

