# BlockNotes — unified app companion (heartbeat, linking, McMMO, playtime)
# File: plugins/RootRecord/blocknotes.yml
# Shared server credentials: plugins/RootRecord/cloud.yml
# Docs: https://rootrecord.info/realm/

cloud:
  heartbeat-interval-minutes: 5
  sync-interval-minutes: 5
  stats-url-base: "https://rootrecord.info/realm/player"

server:
  address: "15.204.13.9:25565"
  default-world-name: "RootRecord SMP"
  game-version: "26.1"
  map-url: ""

mysql:
  enabled: true
  host: "127.0.0.1"
  port: 3306
  database: "minecraft"
  username: "root"
  password: ""
  table-prefix: ""
  pool-size: 5
  jdbc-params: "useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"

mcmmo:
  enabled: true
  table-prefix: "mcmmo_"

messages:
  prefix: "&8[&bBlockNotes&8]&r "
  heartbeat-ok: "&aCloud heartbeat sent."
  status: "&7BlockNotes &f{version}&7 — API &f{api}&7 — world &f{world}"
  link-started: "&aVerification code: &f{code}&a — open &f{url}&a (expires in 15 min)"
  link-already: "&aYour account is linked to RootRecord (&f{account}&a)."
  link-not: "&eYou are not linked. Run &f/rootstat link&e to verify."
  link-success-sync: "&aAccount linked! Syncing profile…"
  stats-link: "&7Public stats: &b{url}"
  sync-done: "&aSynced &f{count}&a player profile(s) from RootRecord cloud."
  sync-fail: "&cCloud sync failed: &f{error}"
  no-permission: "&cYou don't have permission."
  mysql-disabled: "&cMySQL is disabled in config — local cache unavailable."
  config-missing: "&cRootRecord credentials missing — edit plugins/RootRecord/cloud.yml"
