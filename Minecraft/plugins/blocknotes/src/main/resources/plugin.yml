name: BlockNotes
version: '${version}'
main: com.rootrecord.minecraft.blocknotes.BlockNotesPlugin
api-version: '26.1'
description: Block Notes app companion — linking, McMMO, playtime, and cloud sync.
author: Root Record
website: https://rootrecord.info/realm/
softdepend: [PlaceholderAPI]
commands:
  blocknotes:
    description: Block Notes companion plugin
    usage: /<command> [status|reload]
    aliases: [bn, blocknotesapp]
  rootstat:
    description: RootRecord account linking and sync
    usage: /<command> [link|status|sync|reload]
    aliases: [rrlink, rootrecord]
permissions:
  blocknotes.reload:
    description: Reload BlockNotes config
    default: op
  rootstat.link:
    description: Start account linking (/rootstat link)
    default: true
  rootstat.status:
    description: View link status (/rootstat status)
    default: true
  rootstat.sync:
    description: Force cloud sync (/rootstat sync)
    default: op
  rootstat.reload:
    description: Reload BlockNotes / RootStat config
    default: op
