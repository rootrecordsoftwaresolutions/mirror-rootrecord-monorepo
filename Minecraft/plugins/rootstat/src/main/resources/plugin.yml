name: RootStat
version: '${version}'
main: com.rootrecord.minecraft.rootstat.RootStatPlugin
api-version: '26.1'
description: Links Minecraft players to RootRecord accounts — D1 global sync + local MySQL cache.
author: Root Record
website: https://rootrecord.info/realm/
softdepend: [Vault, PlaceholderAPI]
commands:
  rootstat:
    description: RootRecord account linking and sync
    usage: /<command> [link|status|sync|reload]
    aliases: [rrlink, rootrecord]
permissions:
  rootstat.link:
    description: Start account linking (/rootstat link)
    default: true
  rootstat.status:
    description: View link status (/rootstat status)
    default: true
  rootstat.sync:
    description: Force cloud sync (/rootstat sync)
    default: op
  rootstat.reload:
    description: Reload RootStat config
    default: op
